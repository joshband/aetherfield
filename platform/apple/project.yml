# xcodegen spec for the Aetherfield AUv3 skeleton (Task 3,
# docs/phases/phase1-wrapper-skeleton-plan.md). This file is the source
# of truth; platform/apple/Aetherfield.xcodeproj/ is generated from it via
# `xcodegen generate` and may be regenerated at any time.
#
# Bundle identifiers below (com.aetherfield.placeholder.*) are explicit
# placeholders per ADR-007/ADR-010's deferred real-identifier decision --
# not a product commitment. AetherfieldAUExtension's identifier is
# nested under AetherfieldHost's (...AetherfieldHost.AetherfieldAUExtension,
# not a sibling ...AetherfieldAUExtension) because Apple's embedded-binary
# validation rejects an extension whose bundle identifier is not prefixed
# by its container app's identifier ("Embedded binary's bundle identifier
# is not prefixed with the parent app's bundle identifier") -- confirmed
# by an actual build failure with the original sibling placeholders, not
# assumed in advance.
#
# deploymentTarget "26.0" is ADR-010's rolling "current major version
# minus one" floor, re-verified 2026-09-20 (see ADR-010's "Re-verification
# note" -- no drift found; iOS 27/iPadOS 27 remains current, so the floor
# remains iOS/iPadOS 26+).
#
# DEVELOPMENT_TEAM/CODE_SIGN_STYLE (added 2026-09-20, host/device
# acceptance Task 0/1): the owner's Apple Developer Program team ID,
# read from the local keychain's sole valid codesigning identity
# ("Apple Development: joshband@gmail.com", cert OU field), not invented.
# CODE_SIGN_STYLE Automatic matches this project having no provisioning
# profile registered yet -- Xcode/xcodebuild manages App ID registration
# and profile creation itself rather than requiring one pre-supplied.
# This is signing configuration only; it does not change source, DSP
# behavior, or bundle identifiers, which remain the explicit placeholders
# named above pending their own separate decision.
name: Aetherfield
options:
  bundleIdPrefix: com.aetherfield.placeholder
targets:
  AetherfieldAUExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ../../src/dsp
        excludes: ["*.h"]
      - path: ../../src/wrapper
        excludes: ["*.h"]
      - path: ../../src/auv3
    settings:
      HEADER_SEARCH_PATHS: ["$(SRCROOT)/../../src"]
      CLANG_CXX_LANGUAGE_STANDARD: "c++20"
      PRODUCT_BUNDLE_IDENTIFIER: com.aetherfield.placeholder.AetherfieldHost.AetherfieldAUExtension
      DEVELOPMENT_TEAM: W2VVZU52J6
      CODE_SIGN_STYLE: Automatic
    # xcodegen's `info:` key GENERATES the Info.plist at this path on
    # every `xcodegen generate` run -- it does not preserve a hand-edited
    # file there (confirmed: an earlier hand-authored Info.plist at this
    # exact path was silently overwritten with xcodegen's bare-minimum
    # default on the first `generate`). The fix is to hand xcodegen the
    # custom keys via `properties:` so they are merged into the plist it
    # writes, rather than trying to keep a separately hand-maintained
    # file at the same path that `xcodegen generate` would just clobber
    # again on the next run. NOTE: src/auv3/Info.plist itself carries a
    # "GENERATED, do not hand-edit" XML comment for anyone who opens that
    # file directly, but xcodegen writes the plist from this properties:
    # data only, not from that file's existing XML text -- so that
    # comment (and the subtype/manufacturer placeholder note below) does
    # NOT survive a future `xcodegen generate` and must be re-added by
    # hand afterward until this is solved more durably (e.g. a
    # post-generation script, or xcodegen support for preserving
    # arbitrary plist comments).
    info:
      path: ../../src/auv3/Info.plist
      properties:
        CFBundleDisplayName: Aetherfield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit
          NSExtensionPrincipalClass: AetherfieldAudioUnitFactory
          NSExtensionAttributes:
            AudioComponents:
              # type/subtype/manufacturer are ALL explicit placeholders,
              # same as the com.aetherfield.placeholder.* bundle
              # identifiers above -- not just the bundle IDs are
              # placeholder values in this component registration.
              - type: aufx
                subtype: Aeth
                manufacturer: Josh
                name: "Aetherfield: Reverb"
                description: "Aetherfield ambient reverb (AUv3 skeleton over src/dsp/DiffusionStereoPath; not yet auval/host/device verified)"
                version: 1
                factoryFunction: AetherfieldAudioUnitFactory
                sandboxSafe: true
                tags:
                  - Effects
    # NOTE: a top-level `frameworks:` key (as this plan's own template
    # text originally specified) is not a recognized xcodegen 2.46.0
    # target key -- xcodegen silently ignores it (no schema error), so
    # AudioToolbox/AVFoundation were never added to the "Link Binary With
    # Libraries" build phase and the link step failed with undefined
    # AUAudioUnit/AVAudioFormat/etc. symbols. The correct xcodegen key for
    # linking an SDK framework is `dependencies: - sdk: <name>`.
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
  AetherfieldAUExtensionMacOS:
    type: bundle
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: ../../src/dsp
        excludes: ["*.h"]
      - path: ../../src/wrapper
        excludes: ["*.h"]
      - path: ../../src/auv3
    settings:
      HEADER_SEARCH_PATHS: ["$(SRCROOT)/../../src"]
      CLANG_CXX_LANGUAGE_STANDARD: "c++20"
      PRODUCT_BUNDLE_IDENTIFIER: com.aetherfield.placeholder.AetherfieldHostMacOS.AetherfieldAUExtensionMacOS
      DEVELOPMENT_TEAM: W2VVZU52J6
      CODE_SIGN_STYLE: Automatic
      WRAPPER_EXTENSION: component
    info:
      path: ../../src/auv3/Info.plist
      properties:
        CFBundleDisplayName: Aetherfield
        AudioComponents:
          - type: aufx
            subtype: Aeth
            manufacturer: Josh
            name: "Aetherfield: Reverb"
            description: "Aetherfield ambient reverb (AUv3 macOS)"
            version: 1
            factoryFunction: AetherfieldAudioUnitFactory
            sandboxSafe: true
            tags:
              - Effects
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit
          NSExtensionPrincipalClass: AetherfieldAudioUnitFactoryImpl
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
  AetherfieldHostMacOS:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: AetherfieldHost
    info:
      path: AetherfieldHost/Info.plist
      properties: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aetherfield.placeholder.AetherfieldHostMacOS
      GENERATE_INFOPLIST_FILE: true
      DEVELOPMENT_TEAM: W2VVZU52J6
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
    dependencies:
      - target: AetherfieldAUExtensionMacOS
        embed: true
  AetherfieldHost:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    # sources was `[]` until 2026-09-20: an app target with no source
    # files links no Mach-O binary at all. `xcodebuild build` and
    # `codesign` do not catch this (codesign signs the bundle even with
    # no CFBundleExecutable present); only an actual install attempt does
    # -- see docs/testing.md's 2026-09-20 correction note. AetherfieldHost
    # still has no real UI; main.m is a bare, behavior-free
    # UIApplicationDelegate solely so a real executable links.
    sources:
      - path: AetherfieldHost
    # AetherfieldHost remains behavior-free, but iOS now requires apps to
    # adopt UIScene lifecycle configuration. There is deliberately no
    # storyboard: the empty scene delegate only supplies its required window.
    info:
      path: AetherfieldHost/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIApplicationSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: AetherfieldHostSceneDelegate
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aetherfield.placeholder.AetherfieldHost
      CODE_SIGN_ENTITLEMENTS: AetherfieldHost/AetherfieldHost.entitlements
      # The `info:` block above makes XcodeGen write the host's generated
      # Info.plist. This container exists only so AetherfieldAUExtension can
      # be embedded; the generated plist supplies its required scene setup
      # without adding a storyboard or other UI content.
      GENERATE_INFOPLIST_FILE: true
      DEVELOPMENT_TEAM: W2VVZU52J6
      CODE_SIGN_STYLE: Automatic
      # Three warnings chased 2026-09-20 (docs/testing.md "Signed Release
      # build unblocked" / "Bounded repair applied and verified"):
      #
      # 1. CFBundleVersion/CFBundleShortVersionString were entirely absent
      #    from AetherfieldHost's generated Info.plist (PlistBuddy: "Does
      #    Not Exist"), while AetherfieldAUExtension's are "1"/"1.0" --
      #    inspected directly, not assumed. CURRENT_PROJECT_VERSION/
      #    MARKETING_VERSION below match the extension's actual values,
      #    not an invented scheme.
      # 2 & 3. Both warnings' own text says "unless the app requires full
      #    screen." UIRequiresFullScreen was tried first as the single
      #    more-honest fix (AetherfieldHost has no UI and will never have
      #    one), but a rebuild showed Apple deprecates that exact key
      #    starting iOS 26.0 -- this project's own deployment floor
      #    (ADR-010) -- "will be ignored in a future release." Not usable
      #    as a durable fix here. Reverted to the orientation+launch-screen
      #    pair instead: INFOPLIST_KEY_UISupportedInterfaceOrientations
      #    declares all four orientations (Xcode's own default set,
      #    imposing no real constraint since this app never renders
      #    anything to rotate), and INFOPLIST_KEY_UILaunchScreen_Generation
      #    asks Xcode to synthesize an empty UILaunchScreen dict --
      #    supported since iOS 14+, no physical storyboard file needed.
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: AetherfieldAUExtension
        embed: true
  # Minimal AVAudioUnitComponentManager/AUAudioUnit instantiation harness
  # (2026-09-20), one level beyond `pluginkit -m`'s registration-only
  # confirmation -- see docs/testing.md "Bounded repair applied and
  # verified" and AetherfieldHarnessTests/ComponentInstantiationTests.mm's
  # own header comment. Evidence-gathering only; not a shipping target.
  # Hosted inside AetherfieldHost (TEST_HOST/BUNDLE_LOADER) so
  # `xcodebuild test` builds and installs the real container+extension
  # before running, rather than depending on a prior manual install.
  AetherfieldHarnessTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AetherfieldHarnessTests
    settings:
      CLANG_CXX_LANGUAGE_STANDARD: "c++20"
      PRODUCT_BUNDLE_IDENTIFIER: com.aetherfield.placeholder.AetherfieldHost.AetherfieldHarnessTests
      GENERATE_INFOPLIST_FILE: true
      DEVELOPMENT_TEAM: W2VVZU52J6
      CODE_SIGN_STYLE: Automatic
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AetherfieldHost.app/AetherfieldHost"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: AetherfieldHost
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
schemes:
  AetherfieldHarness:
    build:
      targets:
        AetherfieldHarnessTests: [test]
    test:
      targets:
        - AetherfieldHarnessTests
